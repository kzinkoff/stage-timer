<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Stage — Timer</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0f172a;
      color: #ffffff;
      transition: background-color 0.4s ease;
    }

    .hidden {
      display: none !important;
    }

    /* Mode 1: PIN entry screen */
    .pin-screen {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background-color: #0f172a;
    }

    .pin-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 20px;
      padding: 24px;
      width: 100%;
      max-width: 380px;
      text-align: center;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45);
    }

    .pin-card h1 {
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .pin-card p {
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 16px;
    }

    .pin-display {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 14px;
    }

    .pin-digit {
      width: 54px;
      height: 64px;
      border-radius: 12px;
      background: #0f172a;
      border: 2px solid #334155;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      font-weight: 900;
      color: #f8fafc;
    }

    .pin-digit.filled {
      border-color: #3b82f6;
      color: #93c5fd;
    }

    .pin-error {
      color: #f87171;
      font-size: 13px;
      min-height: 20px;
      margin-bottom: 10px;
      font-weight: 600;
    }

    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .key-btn {
      background: #334155;
      color: #ffffff;
      border: none;
      border-radius: 12px;
      padding: 16px 0;
      font-size: 24px;
      font-weight: 700;
      cursor: pointer;
      touch-action: manipulation;
    }

    .key-btn:active {
      background: #475569;
      transform: scale(0.96);
    }

    .key-btn.action-del {
      background: #475569;
      font-size: 20px;
    }

    .key-btn.action-ok {
      background: #2563eb;
      font-size: 16px;
    }

    /* Mode 2: Stage timer screen */
    .stage-container {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
      padding: 6vh 2vw 2.5vh;
      gap: 1.5vh;
    }

    /* Top bar */
    .top-bar {
      position: absolute;
      top: 1.5vh;
      left: 2vw;
      right: 2vw;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: clamp(12px, 1.8vmin, 22px);
      font-weight: 600;
      letter-spacing: 0.05em;
      z-index: 5;
      gap: 10px;
      flex-wrap: wrap;
    }

    .top-left {
      display: flex;
      align-items: center;
      gap: 10px;
      opacity: 0.85;
      flex-wrap: wrap;
    }

    .wake-badge {
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(250, 204, 21, 0.75);
      color: #fef08a;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: clamp(11px, 1.5vmin, 16px);
      font-weight: 600;
      cursor: pointer;
    }

    .wake-badge.active {
      background: rgba(0, 0, 0, 0.35);
      border-color: rgba(74, 222, 128, 0.65);
      color: #ffffff;
      cursor: default;
    }

    .top-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background-color: #4ade80;
    }

    .status-dot.offline {
      background-color: #ef4444;
      box-shadow: 0 0 8px #fff;
    }

    .top-btn {
      background: rgba(0, 0, 0, 0.35);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.4);
      padding: 8px 14px;
      border-radius: 8px;
      font-size: clamp(12px, 1.7vmin, 18px);
      cursor: pointer;
      font-weight: 600;
    }

    .top-btn:hover {
      background: rgba(0, 0, 0, 0.55);
    }

    /* "TIME'S UP!" or "PAUSED" badge */
    .alert-badge {
      display: none;
      font-size: clamp(44px, 11.5vmin, 160px);
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      line-height: 1;
      text-align: center;
      text-shadow: 0 4px 16px rgba(0, 0, 0, 0.45);
    }

    .stage-container.has-alert .alert-badge {
      display: block;
    }

    /* Large countdown digits */
    .timer-display {
      font-size: 31vw;
      font-weight: 900;
      line-height: 0.92;
      font-variant-numeric: tabular-nums;
      font-feature-settings: "tnum";
      letter-spacing: -0.02em;
      text-align: center;
      text-shadow: 0 6px 24px rgba(0, 0, 0, 0.3);
      transition: font-size 0.25s ease, color 0.3s ease;
    }

    .timer-display.overtime {
      font-size: 26vw;
    }

    /* When TIME'S UP! or PAUSED alert is visible */
    .stage-container.has-alert .timer-display {
      font-size: 24vw;
    }

    .stage-container.has-alert .timer-display.overtime {
      font-size: 22vw;
    }

    /* When speaker message is visible — shrink timer digits and give room to text */
    .stage-container.has-message .alert-badge {
      font-size: clamp(32px, 7vmin, 96px);
    }

    .stage-container.has-message .timer-display {
      font-size: min(17vw, 22vmin);
    }

    .stage-container.has-message .timer-display.overtime {
      font-size: min(15vw, 20vmin);
    }

    /* Organizer message (large, in flow below timer) */
    .message-box {
      display: none;
      width: 100%;
      max-width: 96vw;
      background: rgba(0, 0, 0, 0.85);
      color: #fde047;
      border: 4px solid rgba(255, 255, 255, 0.9);
      border-radius: 24px;
      padding: 2.5vh 3vw;
      text-align: center;
      font-size: clamp(42px, 10.5vmin, 140px);
      font-weight: 900;
      line-height: 1.15;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.55);
      word-wrap: break-word;
      overflow-wrap: break-word;
    }

    .message-box.visible {
      display: block;
    }

    .message-box.long-message {
      font-size: clamp(32px, 8vmin, 100px);
    }

    /* Flashing red after reaching 00:00 */
    @keyframes flashRed {
      0%, 100% {
        background-color: var(--red-color, #dc2626);
        color: #ffffff;
      }
      50% {
        background-color: #111111;
        color: #ff4d4d;
      }
    }

    body.overtime-flash {
      animation: flashRed 1s infinite;
    }

    body.overtime-flash .timer-display,
    body.overtime-flash .alert-badge {
      color: inherit !important;
    }
  </style>
</head>
<body>

  <!-- Mode 1: PIN entry -->
  <div class="pin-screen" id="pinScreen">
    <div class="pin-card">
      <h1>Stage Tablet Connection</h1>
      <p>Enter the 4-digit PIN from the organizer's remote or scan the QR code</p>

      <div class="pin-display" id="pinDisplay">
        <div class="pin-digit"></div>
        <div class="pin-digit"></div>
        <div class="pin-digit"></div>
        <div class="pin-digit"></div>
      </div>

      <div class="pin-error" id="pinError"></div>

      <div class="keypad">
        <button class="key-btn" data-key="1">1</button>
        <button class="key-btn" data-key="2">2</button>
        <button class="key-btn" data-key="3">3</button>
        <button class="key-btn" data-key="4">4</button>
        <button class="key-btn" data-key="5">5</button>
        <button class="key-btn" data-key="6">6</button>
        <button class="key-btn" data-key="7">7</button>
        <button class="key-btn" data-key="8">8</button>
        <button class="key-btn" data-key="9">9</button>
        <button class="key-btn action-del" id="btnBackspace">⌫</button>
        <button class="key-btn" data-key="0">0</button>
        <button class="key-btn action-ok" id="btnConnectPin">Connect</button>
      </div>
    </div>
  </div>

  <!-- Mode 2: Stage timer display -->
  <div class="stage-container hidden" id="stageContainer">
    <div class="top-bar">
      <div class="top-left">
        <span class="status-dot" id="connDot"></span>
        <span id="pinLabel">PIN: ----</span>
        <span class="wake-badge" id="wakeStatus">👆 Tap screen to keep awake</span>
      </div>
      <div class="top-right" id="topControls">
        <button class="top-btn" id="btnChangePin">Change PIN</button>
        <button class="top-btn" id="fsBtn">Fullscreen</button>
      </div>
    </div>

    <div class="alert-badge" id="alertBadge"></div>
    <div class="timer-display" id="timerDisplay">15:00</div>

    <div class="message-box" id="messageBox"></div>
  </div>

  <script>
    const pinScreen = document.getElementById('pinScreen');
    const stageContainer = document.getElementById('stageContainer');
    const pinDigits = document.querySelectorAll('#pinDisplay .pin-digit');
    const pinError = document.getElementById('pinError');

    const pinLabel = document.getElementById('pinLabel');
    const wakeStatus = document.getElementById('wakeStatus');
    const timerDisplay = document.getElementById('timerDisplay');
    const alertBadge = document.getElementById('alertBadge');
    const messageBox = document.getElementById('messageBox');
    const connDot = document.getElementById('connDot');
    const fsBtn = document.getElementById('fsBtn');
    const topControls = document.getElementById('topControls');

    let enteredPin = '';
    let activePin = null;
    let eventSource = null;
    let serverTimeOffset = 0;

    let roomState = {
      status: 'idle',
      durationSec: 900,
      remainingMs: 900000,
      endTimeMs: null,
      message: '',
      showMessage: false,
      settings: {
        blackBackground: false,
        yellowThresholdSec: 300,
        redThresholdSec: 60,
        greenColor: '#16a34a',
        yellowColor: '#eab308',
        redColor: '#dc2626'
      }
    };

    // Dual anti-sleep protection:
    // 1. Native Screen Wake Lock API (HTTPS / localhost)
    // 2. Hidden looping MP4 video fallback (NoSleep technique for HTTP LAN & older iPads)

    let wakeLock = null;
    let noSleepVideo = null;
    let noSleepPlaying = false;

    function initNoSleepVideo() {
      if (noSleepVideo) return noSleepVideo;
      const v = document.createElement('video');
      v.setAttribute('playsinline', '');
      v.setAttribute('webkit-playsinline', '');
      v.setAttribute('muted', '');
      v.setAttribute('loop', '');
      v.muted = true;
      v.loop = true;
      v.src = NOSLEEP_MP4_URI;
      v.style.position = 'fixed';
      v.style.width = '1px';
      v.style.height = '1px';
      v.style.opacity = '0.01';
      v.style.pointerEvents = 'none';
      v.style.bottom = '0';
      v.style.right = '0';
      v.style.zIndex = '-1';

      v.addEventListener('timeupdate', () => {
        if (v.currentTime > 0.5) {
          v.currentTime = Math.random() * 0.2;
        }
      });

      v.addEventListener('play', () => {
        noSleepPlaying = true;
        refreshWakeBadge();
      });

      v.addEventListener('pause', () => {
        noSleepPlaying = false;
        refreshWakeBadge();
      });

      document.body.appendChild(v);
      noSleepVideo = v;
      return v;
    }

    function isWakeProtectionActive() {
      const hasNative = Boolean(wakeLock && !wakeLock.released);
      const hasVideo = Boolean(noSleepVideo && !noSleepVideo.paused && noSleepPlaying);
      return hasNative || hasVideo;
    }

    function refreshWakeBadge() {
      if (isWakeProtectionActive()) {
        wakeStatus.textContent = '☀️ Screen Awake';
        wakeStatus.classList.add('active');
      } else {
        wakeStatus.textContent = '👆 Tap screen to keep awake';
        wakeStatus.classList.remove('active');
      }
    }

    async function requestWakeLock() {
      // 1. Try native Screen Wake Lock API first
      if ('wakeLock' in navigator) {
        if (!wakeLock || wakeLock.released) {
          try {
            wakeLock = await navigator.wakeLock.request('screen');
            wakeLock.addEventListener('release', () => {
              wakeLock = null;
              refreshWakeBadge();
            });
          } catch (e) {
            // Native Wake Lock blocked or awaiting user gesture
          }
        }
      }

      // 2. Always start/maintain hidden looping video fallback (covers HTTP LAN & older iOS/Android)
      try {
        const v = initNoSleepVideo();
        if (v.paused) {
          await v.play();
          noSleepPlaying = true;
        }
      } catch (e) {
        // Video playback blocked until user taps the screen
      }

      refreshWakeBadge();
    }

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && activePin) {
        requestWakeLock();
      }
    });

    // Auto-request Wake Lock + video fallback on any touch or click
    ['click', 'touchstart'].forEach(evt => {
      document.addEventListener(evt, () => {
        if (activePin && !isWakeProtectionActive()) {
          requestWakeLock();
        }
      }, { passive: true });
    });

    // Periodic 15s watchdog to ensure protection stays active while tab is visible
    setInterval(() => {
      if (activePin && document.visibilityState === 'visible' && !isWakeProtectionActive()) {
        requestWakeLock();
      }
    }, 15000);

    function updatePinBoxes() {
      pinDigits.forEach((el, idx) => {
        const ch = enteredPin[idx] || '';
        el.textContent = ch;
        el.classList.toggle('filled', Boolean(ch));
      });
    }

    function showPinScreen(errorMsg = '') {
      if (eventSource) {
        eventSource.close();
        eventSource = null;
      }
      activePin = null;
      document.body.classList.remove('overtime-flash');
      document.body.style.backgroundColor = '#0f172a';
      document.title = 'Stage — Connect';
      stageContainer.classList.add('hidden');
      pinScreen.classList.remove('hidden');
      pinError.textContent = errorMsg;
      history.replaceState(null, '', '/stage');
    }

    async function tryConnectWithPin(pin) {
      const clean = String(pin || '').trim();
      if (!/^\d{4}$/.test(clean)) {
        pinError.textContent = 'Enter a 4-digit PIN code';
        return;
      }

      try {
        const res = await fetch(`/api/room-exists?pin=${encodeURIComponent(clean)}`);
        const data = await res.json();
        if (!res.ok || !data.ok) {
          pinError.textContent = data.error || 'Room with this PIN was not found';
          return;
        }

        pinError.textContent = '';
        activePin = clean;
        history.replaceState(null, '', `/stage?pin=${encodeURIComponent(clean)}`);
        document.title = `Stage — PIN ${clean}`;
        pinLabel.textContent = `PIN: ${clean}`;

        pinScreen.classList.add('hidden');
        stageContainer.classList.remove('hidden');

        requestWakeLock();
        connectSSE(clean);
      } catch (err) {
        pinError.textContent = 'Server connection error';
      }
    }

    // On-screen keypad
    document.querySelectorAll('.key-btn[data-key]').forEach(btn => {
      btn.addEventListener('click', () => {
        if (enteredPin.length < 4) {
          enteredPin += btn.dataset.key;
          pinError.textContent = '';
          updatePinBoxes();
        }
      });
    });

    document.getElementById('btnBackspace').addEventListener('click', () => {
      enteredPin = enteredPin.slice(0, -1);
      pinError.textContent = '';
      updatePinBoxes();
    });

    document.getElementById('btnConnectPin').addEventListener('click', () => {
      tryConnectWithPin(enteredPin);
    });

    // Physical keyboard support on PIN entry screen
    document.addEventListener('keydown', (e) => {
      if (!pinScreen.classList.contains('hidden')) {
        if (/^\d$/.test(e.key) && enteredPin.length < 4) {
          enteredPin += e.key;
          pinError.textContent = '';
          updatePinBoxes();
        } else if (e.key === 'Backspace') {
          enteredPin = enteredPin.slice(0, -1);
          pinError.textContent = '';
          updatePinBoxes();
        } else if (e.key === 'Enter') {
          tryConnectWithPin(enteredPin);
        }
      }
    });

    document.getElementById('btnChangePin').addEventListener('click', () => {
      enteredPin = '';
      updatePinBoxes();
      showPinScreen('');
    });

    function formatTime(ms) {
      const isNegative = ms < 0;
      const totalSeconds = isNegative
        ? Math.floor(Math.abs(ms) / 1000)
        : Math.ceil(ms / 1000);

      const minutes = Math.floor(totalSeconds / 60);
      const seconds = totalSeconds % 60;

      const mm = String(minutes).padStart(2, '0');
      const ss = String(seconds).padStart(2, '0');
      return isNegative ? `-${mm}:${ss}` : `${mm}:${ss}`;
    }

    function renderFrame() {
      if (!activePin) return;

      const now = Date.now() + serverTimeOffset;
      let currentRemainingMs = roomState.remainingMs;

      if (roomState.status === 'running' && roomState.endTimeMs !== null) {
        currentRemainingMs = roomState.endTimeMs - now;
      }

      timerDisplay.textContent = formatTime(currentRemainingMs);

      const s = roomState.settings || {};
      const greenColor = s.greenColor || '#16a34a';
      const yellowColor = s.yellowColor || '#eab308';
      const redColor = s.redColor || '#dc2626';
      const yellowMs = (Number(s.yellowThresholdSec) || 0) * 1000;
      const redMs = (Number(s.redThresholdSec) || 0) * 1000;
      const isBlackBg = Boolean(s.blackBackground);

      document.documentElement.style.setProperty('--red-color', redColor);

      let alertText = '';
      if (currentRemainingMs <= 0 && roomState.status === 'running') {
        document.body.classList.add('overtime-flash');
        document.body.style.backgroundColor = '';
        timerDisplay.style.color = '';
        alertBadge.style.color = '';
        timerDisplay.classList.add('overtime');
        alertText = "TIME'S UP!";
      } else {
        document.body.classList.remove('overtime-flash');
        timerDisplay.classList.toggle('overtime', currentRemainingMs < 0);

        if (roomState.status === 'paused') {
          alertText = 'PAUSED';
        } else if (currentRemainingMs <= 0) {
          alertText = "TIME'S UP!";
        }

        let zoneColor = greenColor;
        if (currentRemainingMs <= redMs) {
          zoneColor = redColor;
        } else if (currentRemainingMs <= yellowMs) {
          zoneColor = yellowColor;
        }

        if (isBlackBg) {
          document.body.style.backgroundColor = '#000000';
          timerDisplay.style.color = zoneColor;
          alertBadge.style.color = zoneColor;
        } else {
          document.body.style.backgroundColor = zoneColor;
          timerDisplay.style.color = '#ffffff';
          alertBadge.style.color = '#ffffff';
        }
      }

      alertBadge.textContent = alertText;
      stageContainer.classList.toggle('has-alert', Boolean(alertText));

      const hasMessage = Boolean(roomState.showMessage && roomState.message);
      stageContainer.classList.toggle('has-message', hasMessage);
      if (hasMessage) {
        messageBox.textContent = roomState.message;
        messageBox.classList.toggle('long-message', roomState.message.length > 35);
        messageBox.classList.add('visible');
      } else {
        messageBox.classList.remove('visible');
      }
    }

    setInterval(renderFrame, 100);

    function connectSSE(pin) {
      if (eventSource) {
        eventSource.close();
      }
      eventSource = new EventSource(`/api/events?pin=${encodeURIComponent(pin)}`);

      eventSource.onopen = () => {
        connDot.classList.remove('offline');
      };

      eventSource.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          if (data.error === 'not_found') {
            connDot.classList.add('offline');
            return;
          }
          connDot.classList.remove('offline');
          if (typeof data.serverNow === 'number') {
            serverTimeOffset = data.serverNow - Date.now();
          }
          roomState = data;
          renderFrame();
        } catch (err) {
          console.error('Failed to parse room state:', err);
        }
      };

      eventSource.onerror = () => {
        connDot.classList.add('offline');
      };
    }

    // Fullscreen toggle
    function toggleFullscreen() {
      requestWakeLock();
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    }

    fsBtn.addEventListener('click', toggleFullscreen);
    document.addEventListener('fullscreenchange', () => {
      topControls.style.display = document.fullscreenElement ? 'none' : 'flex';
    });
    stageContainer.addEventListener('dblclick', toggleFullscreen);

    // Initialize on load (check ?pin=XXXX from QR code or URL)
    (function init() {
      const params = new URLSearchParams(window.location.search);
      const urlPin = (params.get('pin') || '').trim();
      if (urlPin) {
        enteredPin = urlPin.slice(0, 4);
        updatePinBoxes();
        tryConnectWithPin(urlPin);
      } else {
        showPinScreen('');
      }
    })();
  </script>
</body>
</html>
